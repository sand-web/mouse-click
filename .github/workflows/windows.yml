name: Windows build and runtime checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Use locked Yarn version
        run: npm install --global yarn@1.22.22
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Check application types
        run: yarn typecheck
      - name: Test settings behavior and real file persistence
        run: yarn test
      - name: Build Windows installer and portable app
        run: yarn build:windows
      - name: Check production packages and install the app
        run: node scripts/check-windows-packages.cjs
      - name: Build separate runtime test package
        run: node scripts/build-windows.cjs --test-package
      - name: Build independent native reading fixture
        run: node scripts/build-windows.cjs --reader-fixture
      - name: Fetch verified previous release for the reading regression baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path app_output/baseline-1.0.4 -Force | Out-Null
          $baselineFile = 'app_output/baseline-1.0.4/Mouse-Click-1.0.4-x64-Portable.exe'
          Invoke-WebRequest -Uri 'https://github.com/sand-web/mouse-click/releases/download/v1.0.4/Mouse-Click-1.0.4-x64-Portable.exe' -OutFile $baselineFile
          $baselineHash = (Get-FileHash $baselineFile -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($baselineHash -ne '3574a5361528644c84f2773d183c91bf3d2cc4919aca38dcf91897c3d245dff4') { throw 'Previous release SHA256 mismatch' }
      - name: Test real Windows startup, lifecycle, and restart persistence
        run: node scripts/test-windows-runtime.cjs
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-test-evidence
          path: test-results/windows
          if-no-files-found: warn
          retention-days: 30
      - name: Upload verified Windows executables
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mouse-click-windows-x64
          path: |
            app_output/Mouse-Click-*-x64-Setup.exe
            app_output/Mouse-Click-*-x64-Portable.exe
            app_output/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
